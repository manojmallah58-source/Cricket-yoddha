<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Live Player</title>

    <!-- Preconnect for instant network response -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #player-container {
            width: 100%;
            max-width: 1000px;
        }

        #plyr-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
        }

        /* Hide any default poster or flash */
        .plyr__poster {
            background-color: black !important;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <!-- Added preload="auto" for instant buffering start -->
        <video id="plyr-player" controls playsinline muted autoplay preload="auto"></video>
    </div>

    <script>
        const videoSrc = new URLSearchParams(window.location.search).get('url');
        const video = document.getElementById('plyr-player');

        if (videoSrc) {
            // 1. Initialize Plyr instantly so the UI is ready without waiting
            const player = new Plyr(video, {
                autoplay: true,
                muted: true,
                settings: ['quality', 'speed', 'loop']
            });

            if (Hls.isSupported()) {
                const hls = new Hls({
                    liveSyncDurationCount: 0, // Zero delay for live sync
                    lowLatencyMode: true,
                    enableWorker: true,
                    fragLoadingTimeOut: 20000,
                    manifestLoadingTimeOut: 10000
                });

                hls.loadSource(videoSrc);
                hls.attachMedia(video);

                // Play immediately as soon as media is attached
                video.play().catch(() => {});

                // Update qualities dynamically once parsed in background
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const availableQualities = hls.levels
                        .map(l => l.height)
                        .filter((v, i, a) => a.indexOf(v) === i)
                        .sort((a, b) => b - a);

                    player.config.quality = {
                        default: availableQualities[0] || 0,
                        options: availableQualities,
                        forced: true,
                        onChange: (newQuality) => {
                            hls.levels.forEach((level, index) => {
                                if (level.height === newQuality) hls.currentLevel = index;
                            });
                        }
                    };
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari support
                video.src = videoSrc;
                video.play().catch(() => {});
            } else {
                video.src = videoSrc;
                video.play().catch(() => {});
            }
        }
    </script>
</body>
</html>
