<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Live Player</title>

    <!-- Preconnect for faster CDN loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js" defer></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #player-container {
            width: 100%;
            max-width: 1000px;
        }

        #plyr-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
        }

        /* Hide unwanted loading overlay/spinner in plyr for instant look */
        .plyr__poster {
            background-color: black !important;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <video id="plyr-player" controls playsinline muted autoplay></video>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const videoSrc = new URLSearchParams(window.location.search).get('url');
            const video = document.getElementById('plyr-player');

            if (!videoSrc) return;

            // Fast initialization function
            const initPlayer = () => {
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        liveSyncDurationCount: 1, // Ultra-fast live start
                        maxLiveSyncPlaybackRate: 1.5,
                        enableWorker: true,
                        lowLatencyMode: true
                    });

                    hls.loadSource(videoSrc);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        const availableQualities = hls.levels
                            .map(l => l.height)
                            .filter((v, i, a) => a.indexOf(v) === i)
                            .sort((a, b) => b - a);

                        const player = new Plyr(video, {
                            autoplay: true,
                            muted: true,
                            settings: ['quality', 'speed', 'loop'],
                            quality: {
                                default: availableQualities[0] || 0,
                                options: availableQualities,
                                forced: true,
                                onChange: (newQuality) => {
                                    hls.levels.forEach((level, index) => {
                                        if (level.height === newQuality) hls.currentLevel = index;
                                    });
                                }
                            }
                        });

                        // Ensure playback starts immediately
                        video.play().catch(() => {});
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Native HLS support (Safari / iOS)
                    video.src = videoSrc;
                    new Plyr(video, { autoplay: true, muted: true });
                    video.play().catch(() => {});
                } else {
                    video.src = videoSrc;
                    new Plyr(video, { autoplay: true, muted: true });
                }
            };

            // Run instantly
            initPlayer();
        });
    </script>
</body>
</html>
