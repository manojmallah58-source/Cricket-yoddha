<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.8.4/dist/plyr.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.8.4/dist/plyr.polyfilled.js"></script>
<style>
:root{
  --plyr-color-main:#00b8ff;
  --plyr-video-background:#000;
  --plyr-menu-background:rgba(12,14,20,.97);
  --plyr-menu-color:#fff;
  --plyr-tooltip-background:rgba(12,14,20,.97);
  --plyr-tooltip-color:#fff;
  --plyr-font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;min-height:100%;margin:0;padding:0;overflow:hidden;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}
.video-container{position:fixed;inset:0;width:100%;height:100dvh;background:#000;overflow:hidden;isolation:isolate}
#player{display:block;width:100%;height:100%;background:#000;object-fit:contain}
.plyr,.plyr__video-wrapper,.plyr video{width:100%;height:100%;background:#000}
.plyr video{object-fit:contain}
.plyr{--plyr-control-spacing:10px;--plyr-control-radius:6px;--plyr-font-size-base:14px;--plyr-font-size-small:12px}
.plyr__control{transition:background-color .15s ease,opacity .15s ease}
.plyr__control:hover,.plyr__control[aria-expanded="true"]{background:rgba(255,255,255,.08)}
.plyr__menu__container{border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden}
.sonu-aspect-control{width:36px!important;min-width:36px!important;height:36px!important;padding:0!important;display:flex!important;align-items:center;justify-content:center}
.sonu-aspect-control svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sonu-aspect-control:active{transform:scale(.94)}
.buffering-overlay{position:absolute;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:transparent;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .15s ease,visibility .15s ease}
.buffering-overlay.is-visible{opacity:1;visibility:visible}
.buffering-spinner{width:24px;height:24px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-right-color:rgba(255,255,255,.65);border-radius:50%;animation:sonu-spin .72s linear infinite;will-change:transform}
@keyframes sonu-spin{to{transform:rotate(360deg)}}
.video-mode-fit .plyr video,.video-mode-fit #player{object-fit:contain}
.video-mode-stretch .plyr video,.video-mode-stretch #player{object-fit:fill}
.video-mode-crop .plyr video,.video-mode-crop #player{object-fit:cover}
.plain-error{position:fixed;top:16px;right:12px;left:auto;width:min(88vw,720px);z-index:99999;margin:0;padding:0;color:#d5d5d5;background:transparent;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:11px;line-height:1.5;font-weight:400;text-align:right;white-space:normal;pointer-events:none;user-select:none}
@media (max-width:600px){
  .plyr{--plyr-control-spacing:8px}
  .plain-error{top:12px;right:10px;width:min(92vw,620px);font-size:10.5px}
  .sonu-aspect-control{width:34px!important;min-width:34px!important;height:34px!important}
  .sonu-aspect-control svg{width:17px;height:17px}
  .buffering-spinner{width:22px;height:22px}
}
</style>
</head>
<body>
<main class="video-container" id="container">
  <video id="player" controls playsinline preload="metadata"></video>
  <div class="buffering-overlay" id="buffering" aria-hidden="true">
    <span class="buffering-spinner"></span>
  </div>
</main>
<script>
(()=>{"use strict";
const CONFIG=Object.freeze({
  defaultStream:"https://sayan.info/live.m3u8",
  retryBaseMs:1000,
  retryMaxMs:16000,
  maxRecoveryAttempts:8,
  maxImmediateNetworkRecoveries:2,
  mediaRecoveryLimit:2,
  fullRestartLimit:4,
  maxBufferLength:30,
  backBufferLength:30,
  maxMaxBufferLength:60,
  maxBufferSize:62914560,
  maxBufferHole:.5,
  lowLatencyMode:false,
  liveSyncDurationCount:5,
  liveMaxLatencyDurationCount:12,
  maxLiveSyncPlaybackRate:1,
  startupTimeoutMs:30000,
  visibilityRecoveryCooldownMs:3000,
  bufferingDelayMs:450,
  stallRecoveryDelayMs:2500,
  stallRecoveryCooldownMs:6000
});
const state={
  container:null,
  video:null,
  buffering:null,
  plyr:null,
  hls:null,
  src:"",
  logo:"",
  destroyed:false,
  usingNative:false,
  initializing:false,
  recoveryTimer:0,
  recoveryAttempts:0,
  immediateNetworkRecoveries:0,
  mediaRecoveries:0,
  fullRestarts:0,
  lastErrorKey:"",
  lastNetworkErrorAt:0,
  lastVisibilityRecoveryAt:0,
  lastStallRecoveryAt:0,
  sourceGeneration:0,
  startupTimer:0,
  bufferingTimer:0,
  stallTimer:0,
  aspectIndex:0,
  wasPlayingBeforeHidden:false,
  lastKnownTime:0
};
const $=id=>document.getElementById(id);
function text(value){return String(value??"").trim()}
function lockOrientation(orientation){
  try{
    const so=screen.orientation||screen.mozOrientation||screen.msOrientation;
    if(so&&typeof so.lock==="function"){so.lock(orientation).catch(()=>{});return}
    if(typeof screen.lockOrientation==="function"){screen.lockOrientation(orientation);return}
    if(typeof screen.mozLockOrientation==="function"){screen.mozLockOrientation(orientation);return}
    if(typeof screen.msLockOrientation==="function"){screen.msLockOrientation(orientation);return}
  }catch(_){}
}
function unlockOrientation(){
  try{
    const so=screen.orientation||screen.mozOrientation||screen.msOrientation;
    if(so&&typeof so.unlock==="function"){so.unlock();return}
    if(typeof screen.unlockOrientation==="function"){screen.unlockOrientation();return}
    if(typeof screen.mozUnlockOrientation==="function"){screen.mozUnlockOrientation();return}
    if(typeof screen.msUnlockOrientation==="function"){screen.msUnlockOrientation();return}
  }catch(_){}
}
function setError(message){
  const value=text(message)||"STREAM ERROR";
  if(state.lastErrorKey===value)return;
  state.lastErrorKey=value;
  let node=$("plain-error");
  if(!node){
    node=document.createElement("div");
    node.id="plain-error";
    node.className="plain-error";
    state.container?.appendChild(node);
  }
  node.textContent=value;
}
function clearError(){
  state.lastErrorKey="";
  const node=$("plain-error");
  if(node)node.remove();
}
function showBuffering(){
  if(!state.buffering)return;
  state.buffering.classList.add("is-visible");
  state.buffering.setAttribute("aria-hidden","false");
}
function hideBuffering(){
  if(state.bufferingTimer){
    clearTimeout(state.bufferingTimer);
    state.bufferingTimer=0;
  }
  if(state.stallTimer){
    clearTimeout(state.stallTimer);
    state.stallTimer=0;
  }
  if(!state.buffering)return;
  state.buffering.classList.remove("is-visible");
  state.buffering.setAttribute("aria-hidden","true");
}
function scheduleBuffering(){
  if(!state.video||state.video.paused||state.video.ended)return;
  if(state.buffering.classList.contains("is-visible"))return;
  if(state.bufferingTimer)return;
  state.bufferingTimer=setTimeout(()=>{
    state.bufferingTimer=0;
    if(!state.video||state.video.paused||state.video.ended)return;
    if(state.video.readyState<3||state.video.seeking)showBuffering();
  },CONFIG.bufferingDelayMs);
}
function scheduleStallRecovery(){
  if(state.destroyed||!state.video||state.video.paused||state.video.ended)return;
  if(state.stallTimer)return;
  state.stallTimer=setTimeout(()=>{
    state.stallTimer=0;
    if(state.destroyed||!state.video||state.video.paused||state.video.ended)return;
    if(Date.now()-state.lastStallRecoveryAt<CONFIG.stallRecoveryCooldownMs)return;
    if(state.video.readyState>=3&&!state.video.seeking)return;
    state.lastStallRecoveryAt=Date.now();
    if(state.hls){
      try{state.hls.startLoad(-1);return}catch(_){}
    }
    scheduleRecovery("STREAM_NETWORK_ERROR");
  },CONFIG.stallRecoveryDelayMs);
}
function parseHttpUrl(value,fallback=""){
  const raw=text(value);
  if(!raw)return fallback;
  try{
    const parsed=new URL(raw,window.location.href);
    return /^https?:$/i.test(parsed.protocol)?parsed.href:fallback;
  }catch(_){return fallback}
}
function decodeParam(value){
  try{return decodeURIComponent(value)}catch(_){return value}
}
function getQueryValues(){
  const query=window.location.search.replace(/^\?/,"");
  const logoMatch=query.match(/(?:^|&)logo=([\s\S]*)$/i);
  const urlMatch=query.match(/(?:^|&)url=/i);
  let source="";
  let logo="";
  if(urlMatch){
    const start=urlMatch.index+urlMatch[0].length;
    const rawRest=query.slice(start);
    const logoIndex=rawRest.search(/&logo=/i);
    const rawSource=logoIndex>=0?rawRest.slice(0,logoIndex):rawRest;
    source=decodeParam(rawSource);
  }
  if(logoMatch)logo=decodeParam(logoMatch[1]);
  if(!source){
    const params=new URLSearchParams(window.location.search);
    source=params.get("url")||"";
  }
  if(!logo){
    const params=new URLSearchParams(window.location.search);
    logo=params.get("logo")||"";
  }
  return{src:parseHttpUrl(source,CONFIG.defaultStream),logo:parseHttpUrl(logo,"")};
}
function stopStartupTimer(){
  if(state.startupTimer){clearTimeout(state.startupTimer);state.startupTimer=0}
}
function stopRecoveryTimer(){
  if(state.recoveryTimer){clearTimeout(state.recoveryTimer);state.recoveryTimer=0}
}
function destroyPlyr(){
  if(!state.plyr)return;
  try{state.plyr.destroy()}catch(_){}
  state.plyr=null;
  unlockOrientation();
}
function detachHls(){
  if(!state.hls)return;
  const instance=state.hls;
  state.hls=null;
  try{instance.stopLoad()}catch(_){}
  try{instance.detachMedia()}catch(_){}
  try{instance.destroy()}catch(_){}
}
function resetMediaElement(){
  if(!state.video)return;
  try{
    state.video.pause();
    state.video.removeAttribute("src");
    state.video.load();
  }catch(_){}
}
function cleanupCurrentSource(resetElement=true){
  stopStartupTimer();
  stopRecoveryTimer();
  hideBuffering();
  detachHls();
  destroyPlyr();
  if(resetElement)resetMediaElement();
  state.usingNative=false;
  state.initializing=false;
}
function getQualityHeights(levels){
  if(!Array.isArray(levels))return[];
  return[...new Set(levels.map(level=>Number(level?.height)).filter(height=>Number.isFinite(height)&&height>0))].sort((a,b)=>b-a);
}
function chooseDefaultQuality(qualities){
  if(qualities.includes(720))return 720;
  if(qualities.includes(576))return 576;
  if(qualities.includes(480))return 480;
  return qualities[0];
}
function aspectIcon(mode){
  if(mode==="fit")return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.5"></rect><path d="M8 6v3M4 10h3M16 6v3M20 10h-3M8 18v-3M4 14h3M16 18v-3M20 14h-3"></path></svg>';
  if(mode==="stretch")return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="14" height="10" rx="1.5"></rect><path d="M3 7h2M3 17h2M19 7h2M19 17h2M3 12h3M18 12h3"></path></svg>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"></path><path d="M8 4v5M4 8h5M16 4v5M20 8h-5M8 20v-5M4 16h5M16 20v-5M20 16h-5"></path></svg>';
}
function applyAspectMode(){
  const root=state.plyr?.elements?.container||state.container;
  if(!root)return;
  root.classList.remove("video-mode-fit","video-mode-stretch","video-mode-crop");
  const modes=["fit","stretch","crop"];
  const mode=modes[state.aspectIndex];
  root.classList.add("video-mode-"+mode);
  const button=root.querySelector(".sonu-aspect-control");
  if(button){
    button.setAttribute("aria-label",mode.toUpperCase());
    button.setAttribute("title",mode.toUpperCase());
    button.setAttribute("data-mode",mode);
    button.innerHTML=aspectIcon(mode);
  }
}
function addAspectControl(){
  const root=state.plyr?.elements?.container;
  if(!root||root.querySelector(".sonu-aspect-control"))return;
  const fullscreen=root.querySelector('[data-plyr="fullscreen"]');
  const button=document.createElement("button");
  button.type="button";
  button.className="plyr__control sonu-aspect-control";
  button.setAttribute("aria-label","FIT");
  button.setAttribute("title","FIT");
  button.setAttribute("data-mode","fit");
  button.innerHTML=aspectIcon("fit");
  button.addEventListener("click",()=>{
    state.aspectIndex=(state.aspectIndex+1)%3;
    applyAspectMode();
  });
  if(fullscreen&&fullscreen.parentElement)fullscreen.parentElement.insertBefore(button,fullscreen);
  else{
    const controls=root.querySelector(".plyr__controls");
    controls?.appendChild(button);
  }
  applyAspectMode();
}
function enhanceControls(){
  addAspectControl();
}
function createPlayer(qualities,hlsInstance=null){
  if(!state.video||typeof window.Plyr!=="function"){
    setError("PLAYER_INIT_FAILED");
    return null;
  }
  const config={
    controls:["play-large","play","progress","current-time","mute","volume","settings","fullscreen"],
    seekTime:10,
    hideControls:true,
    resetOnEnd:false,
    keyboard:{focused:true,global:true},
    tooltips:{controls:true,seek:true},
    settings:qualities.length&&hlsInstance?["quality"]:[],
    i18n:{
      restart:"Restart",
      play:"Play",
      pause:"Pause",
      seek:"Seek",
      played:"Played",
      buffered:"Buffered",
      currentTime:"Current time",
      duration:"Duration",
      volume:"Volume",
      mute:"Mute",
      unmute:"Unmute",
      enterFullscreen:"Enter fullscreen",
      exitFullscreen:"Exit fullscreen",
      frameTitle:"Video player",
      settings:"Settings",
      quality:"Quality"
    }
  };
  if(qualities.length&&hlsInstance){
    config.quality={
      default:chooseDefaultQuality(qualities),
      options:qualities,
      forced:true,
      onChange:value=>{
        const instance=state.hls;
        if(!instance||instance!==hlsInstance||!Array.isArray(instance.levels))return;
        const target=Number(value);
        if(!Number.isFinite(target))return;
        const index=instance.levels.findIndex(level=>Number(level?.height)===target);
        if(index>=0)instance.currentLevel=index;
      }
    };
  }
  try{
    const instance=new window.Plyr(state.video,config);
    state.plyr=instance;
    enhanceControls();
    if(typeof instance.on==="function"){
      instance.on("enterfullscreen",()=>lockOrientation("landscape"));
      instance.on("exitfullscreen",()=>unlockOrientation());
    }
    return instance;
  }catch(error){
    console.error(error);
    setError("PLAYER_INIT_FAILED");
    return null;
  }
}
function markHealthy(){
  state.recoveryAttempts=0;
  state.immediateNetworkRecoveries=0;
  state.mediaRecoveries=0;
  state.fullRestarts=0;
  state.initializing=false;
  state.lastNetworkErrorAt=0;
  stopRecoveryTimer();
  stopStartupTimer();
  hideBuffering();
  clearError();
}
function responseCode(data){
  const code=Number(data?.response?.code);
  return Number.isInteger(code)&&code>=100&&code<=599?code:0;
}
function hlsDetail(data){return text(data?.details).replace(/_/g," ")}
function transientHttpCode(code){return code===0||code===408||code===425||code===429||code===500||code===502||code===503||code===504}
function permanentHttpCode(code){return code===400||code===401||code===403||code===404||code===405||code===406||code===410||code===415}
function buildHlsErrorMessage(data){
  const code=responseCode(data);
  const detail=hlsDetail(data)||"STREAM_LOAD_FAILED";
  return code?`HTTP ${code} — ${detail}`:`HLS — ${detail}`;
}
function buildMediaErrorMessage(){
  const code=Number(state.video?.error?.code);
  switch(code){
    case 1:return"MEDIA_ERR_ABORTED — CODE 1";
    case 2:return"MEDIA_ERR_NETWORK — CODE 2";
    case 3:return"MEDIA_ERR_DECODE — CODE 3";
    case 4:return"MEDIA_ERR_SRC_NOT_SUPPORTED — CODE 4";
    default:return"MEDIA_ERROR";
  }
}
function scheduleRecovery(reason){
  if(state.destroyed||!state.src)return;
  if(!navigator.onLine){
    setError("NETWORK OFFLINE — WAITING FOR RECONNECT");
    return;
  }
  if(state.recoveryTimer)return;
  if(state.recoveryAttempts>=CONFIG.maxRecoveryAttempts){
    setError(reason||"STREAM_LOAD_FAILED");
    return;
  }
  const attempt=state.recoveryAttempts++;
  const delay=Math.min(CONFIG.retryMaxMs,CONFIG.retryBaseMs*(2**attempt));
  setError(reason||"STREAM RECOVERY");
  state.recoveryTimer=setTimeout(()=>{
    state.recoveryTimer=0;
    recoverStream();
  },delay);
}
function recoverStream(){
  if(state.destroyed||state.initializing||!state.src)return;
  if(!navigator.onLine){
    setError("NETWORK OFFLINE — WAITING FOR RECONNECT");
    return;
  }
  const wasPlaying=!!state.video&&!state.video.paused&&!state.video.ended;
  const restoreTime=Number.isFinite(state.video?.currentTime)?state.video.currentTime:state.lastKnownTime;
  const generation=++state.sourceGeneration;
  state.initializing=true;
  try{
    if(state.hls){
      try{
        state.hls.startLoad(-1);
        state.initializing=false;
        scheduleBuffering();
        if(wasPlaying&&state.video?.paused)state.video.play().catch(()=>{});
        return;
      }catch(_){detachHls()}
    }
    if(state.usingNative){
      try{
        state.video.src=state.src;
        state.video.load();
        const restore=()=>{
          if(restoreTime>0&&Number.isFinite(restoreTime)){
            try{state.video.currentTime=restoreTime}catch(_){}
          }
        };
        state.video.addEventListener("loadedmetadata",restore,{once:true});
        if(wasPlaying)state.video.play().catch(()=>{});
        state.initializing=false;
        scheduleBuffering();
        return;
      }catch(_){state.usingNative=false}
    }
    cleanupCurrentSource(true);
    if(typeof window.Hls==="function"&&window.Hls.isSupported())startHlsPlayback(state.src,wasPlaying,true,generation);
    else if(canUseNativeHls())startNativePlayback(state.src,wasPlaying,true,generation);
    else setError("HLS_NOT_SUPPORTED");
  }finally{
    if(state.sourceGeneration===generation)state.initializing=false;
  }
}
function canUseNativeHls(){
  if(!state.video||typeof state.video.canPlayType!=="function")return false;
  return Boolean(state.video.canPlayType("application/vnd.apple.mpegurl")||state.video.canPlayType("audio/mpegurl"));
}
function startNativePlayback(src,autoplayAfterReady=false,recovering=false,generation=++state.sourceGeneration){
  if(!state.video)return false;
  state.usingNative=true;
  state.src=src;
  try{
    destroyPlyr();
    state.video.src=src;
    state.video.load();
    state.plyr=createPlayer([],null);
    if(!state.plyr){
      state.usingNative=false;
      if(!recovering)setError("PLAYER_INIT_FAILED");
      return false;
    }
    stopStartupTimer();
    state.startupTimer=setTimeout(()=>{
      if(state.sourceGeneration!==generation||state.destroyed)return;
      if(state.video.readyState<2)scheduleRecovery("STREAM_LOAD_FAILED");
    },CONFIG.startupTimeoutMs);
    const ready=()=>{
      if(state.sourceGeneration!==generation||state.destroyed)return;
      markHealthy();
      if(autoplayAfterReady)state.video.play().catch(()=>{});
    };
    state.video.addEventListener("loadedmetadata",ready,{once:true});
    state.video.addEventListener("canplay",ready,{once:true});
    if(autoplayAfterReady)scheduleBuffering();
    return true;
  }catch(error){
    console.error(error);
    state.usingNative=false;
    if(!recovering)setError("HLS_INIT_FAILED");
    return false;
  }
}
function createHlsInstance(){
  if(typeof window.Hls!=="function"||!window.Hls.isSupported())return null;
  return new window.Hls({
    debug:false,
    enableWorker:true,
    lowLatencyMode:CONFIG.lowLatencyMode,
    backBufferLength:CONFIG.backBufferLength,
    maxBufferLength:CONFIG.maxBufferLength,
    maxMaxBufferLength:CONFIG.maxMaxBufferLength,
    maxBufferSize:CONFIG.maxBufferSize,
    maxBufferHole:CONFIG.maxBufferHole,
    capLevelToPlayerSize:true,
    startLevel:-1,
    liveSyncDurationCount:CONFIG.liveSyncDurationCount,
    liveMaxLatencyDurationCount:CONFIG.liveMaxLatencyDurationCount,
    maxLiveSyncPlaybackRate:CONFIG.maxLiveSyncPlaybackRate,
    manifestLoadingMaxRetry:3,
    levelLoadingMaxRetry:3,
    fragLoadingMaxRetry:3,
    manifestLoadingRetryDelay:1000,
    levelLoadingRetryDelay:1000,
    fragLoadingRetryDelay:1000,
    highBufferWatchdogPeriod:2,
    nudgeMaxRetry:4,
    nudgeOffset:.1,
    maxFragLookUpTolerance:.25,
    appendErrorMaxRetry:3
  });
}
function fullHlsRestart(src,autoplayAfterReady,recovering){
  cleanupCurrentSource(true);
  if(typeof window.Hls==="function"&&window.Hls.isSupported())return startHlsPlayback(src,autoplayAfterReady,recovering,++state.sourceGeneration);
  if(canUseNativeHls())return startNativePlayback(src,autoplayAfterReady,recovering,++state.sourceGeneration);
  setError("HLS_NOT_SUPPORTED");
  return false;
}
function startHlsPlayback(src,autoplayAfterReady=false,recovering=false,generation=++state.sourceGeneration){
  if(!state.video)return false;
  const instance=createHlsInstance();
  if(!instance){
    if(!recovering)setError("HLS_NOT_SUPPORTED");
    return false;
  }
  state.hls=instance;
  state.usingNative=false;
  state.src=src;
  let manifestReady=false;
  let startupFinished=false;
  try{
    instance.on(window.Hls.Events.MEDIA_ATTACHED,()=>{
      if(state.destroyed||state.hls!==instance||state.sourceGeneration!==generation)return;
      try{instance.loadSource(src)}catch(_){scheduleRecovery("STREAM_LOAD_FAILED")}
    });
    instance.on(window.Hls.Events.MANIFEST_PARSED,(_,data)=>{
      if(state.destroyed||state.hls!==instance||state.sourceGeneration!==generation)return;
      manifestReady=true;
      startupFinished=true;
      stopStartupTimer();
      destroyPlyr();
      state.plyr=createPlayer(getQualityHeights(data?.levels),instance);
      if(!state.plyr){setError("PLAYER_INIT_FAILED");return}
      state.recoveryAttempts=0;
      state.mediaRecoveries=0;
      state.immediateNetworkRecoveries=0;
      state.fullRestarts=0;
      clearError();
      if(autoplayAfterReady){scheduleBuffering();state.video.play().catch(()=>{})}
    });
    instance.on(window.Hls.Events.ERROR,(_,data)=>{
      if(state.destroyed||state.hls!==instance||state.sourceGeneration!==generation||!data)return;
      const type=data.type;
      const code=responseCode(data);
      if(!data.fatal){
        if(type===window.Hls.ErrorTypes.BUFFER_STALLED_ERROR&&!state.video.paused)scheduleBuffering();
        return;
      }
      if(type===window.Hls.ErrorTypes.NETWORK_ERROR){
        if(permanentHttpCode(code)){
          setError(`HTTP ${code} — ${hlsDetail(data)||"STREAM_LOAD_FAILED"}`);
          return;
        }
        const now=Date.now();
        if(now-state.lastNetworkErrorAt<750)return;
        state.lastNetworkErrorAt=now;
        if(state.immediateNetworkRecoveries<CONFIG.maxImmediateNetworkRecoveries){
          state.immediateNetworkRecoveries++;
          try{
            instance.startLoad(-1);
            setError(buildHlsErrorMessage(data));
            return;
          }catch(_){}
        }
        scheduleRecovery(code&&transientHttpCode(code)?`HTTP ${code} — STREAM_NETWORK_ERROR`:(code?`HTTP ${code} — STREAM_LOAD_FAILED`:"STREAM_NETWORK_ERROR"));
        return;
      }
      if(type===window.Hls.ErrorTypes.MEDIA_ERROR){
        if(state.mediaRecoveries<CONFIG.mediaRecoveryLimit){
          state.mediaRecoveries++;
          try{
            instance.recoverMediaError();
            setError("STREAM_MEDIA_ERROR — RECOVERING");
            return;
          }catch(_){}
        }
        if(state.fullRestarts<CONFIG.fullRestartLimit){
          state.fullRestarts++;
          setError("STREAM_MEDIA_ERROR — RESTARTING");
          scheduleRecovery("STREAM_MEDIA_ERROR");
          return;
        }
        setError("STREAM_MEDIA_ERROR");
        return;
      }
      if(permanentHttpCode(code)){
        setError(`HTTP ${code} — ${hlsDetail(data)||"STREAM_LOAD_FAILED"}`);
        return;
      }
      if(manifestReady||startupFinished)scheduleRecovery(buildHlsErrorMessage(data));else scheduleRecovery("STREAM_LOAD_FAILED");
    });
    instance.on(window.Hls.Events.FRAG_BUFFERED,()=>{
      if(state.hls!==instance||state.sourceGeneration!==generation)return;
      if(state.video?.readyState>=3&&!state.video.paused&&!state.video.seeking)hideBuffering();
    });
    instance.on(window.Hls.Events.LEVEL_SWITCHED,()=>{
      if(state.hls!==instance||state.sourceGeneration!==generation)return;
      if(state.video?.readyState>=2)clearError();
    });
    instance.on(window.Hls.Events.BUFFER_STALLED_ERROR,()=>{
      if(state.hls!==instance||state.video?.paused)return;
      scheduleBuffering();
    });
    instance.on(window.Hls.Events.BUFFER_APPENDED,()=>{
      if(state.hls===instance&&state.video?.readyState>=3&&!state.video.paused&&!state.video.seeking)hideBuffering();
    });
    state.startupTimer=setTimeout(()=>{
      if(state.destroyed||state.hls!==instance||state.sourceGeneration!==generation)return;
      if(!manifestReady)scheduleRecovery("STREAM_LOAD_FAILED");
    },CONFIG.startupTimeoutMs);
    instance.attachMedia(state.video);
    return true;
  }catch(error){
    console.error(error);
    if(state.hls===instance)detachHls();
    if(!recovering)setError("HLS_INIT_FAILED");
    return false;
  }
}
function startPlayback(){
  const values=getQueryValues();
  state.src=values.src;
  state.logo=values.logo;
  state.aspectIndex=0;
  state.video.removeAttribute("poster");
  if(state.logo)state.video.poster=state.logo;
  clearError();
  if(typeof window.Hls==="function"&&window.Hls.isSupported()){
    if(startHlsPlayback(state.src,false,false,++state.sourceGeneration))return;
  }
  if(canUseNativeHls()){
    if(startNativePlayback(state.src,false,false,++state.sourceGeneration))return;
  }
  setError("HLS_NOT_SUPPORTED");
}
function handleVideoError(){
  if(state.destroyed||!state.video?.error)return;
  hideBuffering();
  const mediaCode=Number(state.video.error.code);
  if(mediaCode===MediaError.MEDIA_ERR_ABORTED)return;
  if(mediaCode===MediaError.MEDIA_ERR_NETWORK){scheduleRecovery("MEDIA_ERR_NETWORK — CODE 2");return}
  if(mediaCode===MediaError.MEDIA_ERR_DECODE){
    if(state.hls&&state.mediaRecoveries<CONFIG.mediaRecoveryLimit){
      try{
        state.mediaRecoveries++;
        state.hls.recoverMediaError();
        setError("MEDIA_ERR_DECODE — CODE 3 — RECOVERING");
        return;
      }catch(_){}
    }
    scheduleRecovery("MEDIA_ERR_DECODE — CODE 3");
    return;
  }
  if(mediaCode===MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED){
    if(state.hls){scheduleRecovery("MEDIA_ERR_SRC_NOT_SUPPORTED — CODE 4");return}
    if(typeof window.Hls==="function"&&window.Hls.isSupported()){
      fullHlsRestart(state.src,!state.video.paused,true);
      return;
    }
    if(canUseNativeHls()&&!state.usingNative){
      startNativePlayback(state.src,!state.video.paused,true,++state.sourceGeneration);
      return;
    }
    setError("MEDIA_ERR_SRC_NOT_SUPPORTED — CODE 4");
    return;
  }
  setError(buildMediaErrorMessage());
}
function bindEvents(){
  state.video.addEventListener("playing",()=>{hideBuffering();markHealthy()});
  state.video.addEventListener("play",()=>{clearError();state.video.paused?hideBuffering():scheduleBuffering()});
  state.video.addEventListener("pause",hideBuffering);
  state.video.addEventListener("ended",hideBuffering);
  state.video.addEventListener("canplay",()=>{hideBuffering();if(state.video.readyState>=HTMLMediaElement.HAVE_FUTURE_DATA)clearError()});
  state.video.addEventListener("loadeddata",hideBuffering);
  state.video.addEventListener("timeupdate",()=>{if(Number.isFinite(state.video.currentTime))state.lastKnownTime=state.video.currentTime});
  state.video.addEventListener("error",handleVideoError);
  state.video.addEventListener("waiting",()=>{if(!state.video.paused){scheduleBuffering();scheduleStallRecovery()}});
  state.video.addEventListener("stalled",()=>{if(state.video.paused)return;scheduleBuffering();scheduleStallRecovery()});
  window.addEventListener("online",()=>{
    if(state.destroyed)return;
    state.recoveryAttempts=0;
    state.immediateNetworkRecoveries=0;
    setError("NETWORK RESTORED — RECOVERING");
    stopRecoveryTimer();
    recoverStream();
  },{passive:true});
  window.addEventListener("offline",()=>{
    if(state.destroyed)return;
    hideBuffering();
    stopRecoveryTimer();
    setError("NETWORK OFFLINE — WAITING FOR RECONNECT");
  },{passive:true});
  document.addEventListener("visibilitychange",()=>{
    if(state.destroyed)return;
    if(document.visibilityState==="hidden"){
      state.wasPlayingBeforeHidden=!!state.video&&!state.video.paused&&!state.video.ended;
      return;
    }
    if(!state.video||!state.wasPlayingBeforeHidden)return;
    const now=Date.now();
    if(now-state.lastVisibilityRecoveryAt<CONFIG.visibilityRecoveryCooldownMs)return;
    state.lastVisibilityRecoveryAt=now;
    if(state.hls&&state.video.readyState<3){try{state.hls.startLoad(-1)}catch(_){}
    }
    if(state.video.paused)state.video.play().catch(()=>{});
  },{passive:true});
  ["fullscreenchange","webkitfullscreenchange","mozfullscreenchange","MSFullscreenChange"].forEach(evt=>{
    document.addEventListener(evt,()=>{
      const fsElement=document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement;
      if(!fsElement)unlockOrientation();
    });
  });
  window.addEventListener("pagehide",destroy,{once:true});
}
function destroy(){
  if(state.destroyed)return;
  state.destroyed=true;
  stopStartupTimer();
  stopRecoveryTimer();
  hideBuffering();
  detachHls();
  destroyPlyr();
  unlockOrientation();
}
function init(){
  state.container=$("container");
  state.video=$("player");
  state.buffering=$("buffering");
  if(!state.container||!state.video||!state.buffering){document.body.textContent="PLAYER_INIT_FAILED";return}
  bindEvents();
  startPlayback();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init();
})();
</script>
</body>
</html>
