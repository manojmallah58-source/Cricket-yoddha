<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sportlink Player</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="referrer" content="no-referrer"/>

  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"/>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Plyr JS -->
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

  <style>
    body {
      background-color: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .plyr {
      height: 100%;
      width: 100%;
    }

    #error-message {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      padding: 20px;
      background: rgba(255, 0, 0, 0.2);
      border-radius: 10px;
      border: 1px solid rgba(255, 0, 0, 0.5);
      max-width: 80%;
      z-index: 10;
    }

    #capture-preview {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.1) inset;
      z-index: 10000;
      display: none;
      max-width: 85%;
      max-height: 85%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeInScale 0.3s ease-out forwards;
    }

    @keyframes fadeInScale {
      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    #capture-preview.show {
      display: block;
      opacity: 0;
    }

    #capture-preview .preview-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      color: #4CAF50;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
    }

    #capture-preview .preview-header svg {
      width: 24px;
      height: 24px;
      fill: #4CAF50;
    }

    #capture-preview .image-wrapper {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.05);
    }

    #capture-preview img {
      max-width: 100%;
      max-height: 65vh;
      display: block;
      border-radius: 10px;
    }

    #capture-preview .info {
      color: #888;
      text-align: center;
      margin-top: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    .plyr__controls button[data-plyr="capture"] {
      padding: 7px;
    }

    .plyr__controls button[data-plyr="capture"] svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 5px solid #f3f3f3;
      border-top: 5px solid #4CAF50;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 2s linear infinite;
      z-index: 5;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .plyr.rotate-90 {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      width: 100vh !important;
      height: 100vw !important;
      max-width: none !important;
      max-height: none !important;
      transform: translate(-50%, -50%) rotate(90deg) !important;
      transform-origin: 50% 50% !important;
      z-index: 2147483647 !important;
    }
  </style>
</head>
<body>

  <div class="loader" id="loader"></div>

  <div id="error-message"></div>

  <div class="video-container">
    <video autoplay playsinline muted id="player" controls preload="metadata"></video>
  </div>

  <div id="capture-preview">
    <div class="preview-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
      <span>Frame Captured Successfully</span>
    </div>
    <div class="image-wrapper">
      <img id="captured-image" alt="Captured Frame">
    </div>
    <div class="info">Image downloaded automatically</div>
  </div>

  <script>
    let hls = null;
    let player = null;
    let extrasAttached = false;

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.innerHTML = `<h3>Error</h3><p>${message}</p>`;
      errorDiv.style.display = 'block';
      document.getElementById('loader').style.display = 'none';
    }

    function hideLoader() {
      document.getElementById('loader').style.display = 'none';
    }

    function captureFrame() {
      try {
        const video = document.getElementById("player");
        if (!video) return;

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(function(blob) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
          a.href = url;
          a.download = `frame-capture-${timestamp}.png`;
          a.click();
          
          const preview = document.getElementById('capture-preview');
          const capturedImg = document.getElementById('captured-image');
          capturedImg.src = url;
          preview.classList.add('show');
          
          setTimeout(() => {
            preview.classList.remove('show');
            setTimeout(() => {
              URL.revokeObjectURL(url);
            }, 300);
          }, 2500);
        }, 'image/png');
        
      } catch (error) {
        console.error('Error capturing frame:', error);
      }
    }

    let orientationLocked = false;

    function isTouchDevice() {
      return navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
    }

    function isPortrait() {
      return window.innerHeight > window.innerWidth;
    }

    function lockLandscape(retries = 3) {
      const so = screen.orientation;
      const legacy = screen.lockOrientation ||
                     screen.mozLockOrientation ||
                     screen.msLockOrientation;

      if (so && typeof so.lock === 'function') {
        return (async () => {
          for (let i = 0; i < retries; i++) {
            try {
              await so.lock('landscape');
              return true;
            } catch (e) {
              await new Promise(r => setTimeout(r, 150));
            }
          }
          return false;
        })();
      }

      if (typeof legacy === 'function') {
        try {
          return Promise.resolve(legacy.call(screen, 'landscape') !== false);
        } catch (e) {
          return Promise.resolve(false);
        }
      }

      return Promise.resolve(false);
    }

    function unlockOrientation() {
      try {
        if (screen.orientation && typeof screen.orientation.unlock === 'function') {
          screen.orientation.unlock();
        }
      } catch (e) { /* ignore */ }

      try {
        const legacy = screen.unlockOrientation ||
                       screen.mozUnlockOrientation ||
                       screen.msUnlockOrientation;
        if (typeof legacy === 'function') legacy.call(screen);
      } catch (e) { /* ignore */ }
    }

    function rotateCss(on) {
      const el = (player && player.elements && player.elements.container) ||
                 document.querySelector('.plyr');
      if (!el) return;
      el.classList.toggle('rotate-90', !!on);
    }

    async function handleEnterFullscreen() {
      if (!isTouchDevice()) return;

      orientationLocked = await lockLandscape();

      if (!orientationLocked) {
        rotateCss(isPortrait());
      }
    }

    function handleExitFullscreen() {
      unlockOrientation();
      orientationLocked = false;
      rotateCss(false);
    }

    function handleViewportChange() {
      if (orientationLocked) return;
      const fsElement = document.fullscreenElement || document.webkitFullscreenElement;
      if (!fsElement) return;
      rotateCss(isPortrait());
    }

    function registerOrientationListeners() {
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) handleExitFullscreen();
      });
      document.addEventListener('webkitfullscreenchange', () => {
        if (!document.webkitFullscreenElement) handleExitFullscreen();
      });

      window.addEventListener('resize', handleViewportChange);

      if (screen.orientation && typeof screen.orientation.addEventListener === 'function') {
        screen.orientation.addEventListener('change', handleViewportChange);
      } else {
        window.addEventListener('orientationchange', () => {
          setTimeout(handleViewportChange, 250);
        });
      }
    }

    function setupPlayerExtras(plyrInstance) {
      if (extrasAttached) return;
      extrasAttached = true;

      addCaptureButton(plyrInstance);

      plyrInstance.on('enterfullscreen', handleEnterFullscreen);
      plyrInstance.on('exitfullscreen', handleExitFullscreen);
    }

    function initPlayer(streamUrl) {
      const video = document.getElementById("player");
      const source = streamUrl;

      const defaultOptions = {
        autoplay: true,
        muted: false,
        controls: [
          'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'
        ],
        settings: ['quality']
      };

      if (Hls.isSupported()) {
        hls = new Hls({ 
          autoStartLoad: true,
          debug: false,
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 90
        });

        hls.loadSource(source);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
          hideLoader();
          
          const availableQualities = data.levels.map(l => l.height).sort((a,b) => b - a);

          player = new Plyr(video, {
            ...defaultOptions,
            quality: {
              default: availableQualities[0],
              options: availableQualities,
              forced: true,
              onChange: q => {
                hls.levels.forEach((level, index) => {
                  if (level.height === q) hls.currentLevel = index;
                });
              }
            }
          });

          player.on('ready', () => setupPlayerExtras(player));
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          hideLoader();
          
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                showError('Network error while loading stream.');
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                showError('Media error. Trying to recover...');
                hls.recoverMediaError();
                break;
              default:
                showError('Stream error. Please check the stream URL.');
                hls.destroy();
                break;
            }
          }
        });

      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = source;
        player = new Plyr(video, defaultOptions);
        
        video.addEventListener("loadedmetadata", () => {
          hideLoader();
          video.play();
        });

        video.addEventListener('error', () => {
          hideLoader();
          showError('Failed to load stream in Safari. Please try Chrome or Firefox.');
        });
        
        player.on('ready', () => setupPlayerExtras(player));
      } else {
        hideLoader();
        showError('Your browser does not support HLS streaming. Please use Chrome, Firefox, or Safari.');
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      registerOrientationListeners();

      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get("url");

      if (!streamUrl) {
        hideLoader();
        showError('No stream URL provided. Use ?url=YOUR_STREAM_URL in the address bar.');
        return;
      }

      initPlayer(streamUrl);
    });

    function addCaptureButton(player) {
      const controls = document.querySelector('.plyr__controls');
      if (!controls) {
        setTimeout(() => addCaptureButton(player), 500);
        return;
      }

      if (controls.querySelector('[data-plyr="capture"]')) {
        return;
      }

      const captureBtn = document.createElement('button');
      captureBtn.className = 'plyr__controls__item plyr__control';
      captureBtn.setAttribute('type', 'button');
      captureBtn.setAttribute('data-plyr', 'capture');
      captureBtn.setAttribute('aria-label', 'Capture Frame');
      captureBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
        </svg>
      `;
      
      captureBtn.addEventListener('click', captureFrame);

      const fullscreenBtn = controls.querySelector('[data-plyr="fullscreen"]');
      if (fullscreenBtn) {
        controls.insertBefore(captureBtn, fullscreenBtn);
      } else {
        controls.appendChild(captureBtn);
      }
    }
  </script>
</body>
</html>
